name: Explore With Me Tests

on:
  workflow_dispatch:
    inputs:
      stats_test_mode:
        description: "Режим тестирования рекомендательной системы"
        required: false
        default: ANALYZE
        type: choice
        options:
          - COLLECTION
          - AGGREGATION
          - ANALYZE
      verbose_mode:
        description: "Включить подробные логи во время тестов"
        required: false
        default: false
        type: boolean
      print_logs:
        description: "Включить вывод логов в консоль"
        required: false
        default: false
        type: boolean
  pull_request:

jobs:
  build:
    uses: yandex-praktikum/java-plus-graduation/.github/workflows/api-tests.yml@ci
    with:
      stats_test_mode: ${{ inputs.stats_test_mode }}
      verbose_mode: ${{ inputs.verbose_mode }}
      print_logs: ${{ inputs.print_logs }}
  unit-tests:
    name: Run Java unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests for changed services
        run: mvn -B test -pl stat/analyzer,stat/aggregator,core/event-service,core/request-service -am --no-transfer-progress
