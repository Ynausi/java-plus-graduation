server:
  port: 0

spring:
  application:
    name: collector
  kafka:
    bootstrap-servers: localhost:9092

grpc:
  server:
    port: 0
    reflection-service-enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

stats:
  kafka:
    user-actions-topic: stats.user-actions.v1
