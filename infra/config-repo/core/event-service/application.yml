server:
  port: 0

spring:
  application:
    name: event-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6646/events
    username: events
    password: events

    jpa:
      hibernate:
        ddl-auto: update

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/