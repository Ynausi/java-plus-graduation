server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600

      routes:
        - id: main-ru.practicum.service
          uri: lb://main-ru.practicum.service
          predicates:
            - Path=/categories/**,/admin/categories/**,/admin/compilations/**,/compilations/**,/admin/events/**,/users/**,/events/**,/v1/admin/ratings/**,/v1/{userId}/ratings/**,/v1/ratings/**,/users/{userId}/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: user-ru.practicum.service
          uri: lb://user-ru.practicum.service
          predicates:
            - Path=/admin/users/**