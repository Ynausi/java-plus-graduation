server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/main-service
            - file:./infra/config-repo/stat-server
            - file:./infra/config-repo/gateway-server
            - file:./infra/config-repo/core/user-service
            - file:./infra/config-repo/core/request-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
